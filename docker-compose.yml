services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailer
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-mailer_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-mailer_owner_local}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-mailer_app}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-mailer_app_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-mailer_owner} -d mailer"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/mailer"]
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-secret-key-change-in-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:-mailer_app}:${POSTGRES_RUNTIME_PASSWORD:-mailer_app_local}@postgres:5432/mailer
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_OWNER_USER:-mailer_owner}:${POSTGRES_OWNER_PASSWORD:-mailer_owner_local}@postgres:5432/mailer
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: &app-env
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-secret-key-change-in-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:-mailer_app}:${POSTGRES_RUNTIME_PASSWORD:-mailer_app_local}@postgres:5432/mailer
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mailer
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN:-}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      NEVERBOUNCE_API_KEY: ${NEVERBOUNCE_API_KEY:-}
      NEVERBOUNCE_API_URL: ${NEVERBOUNCE_API_URL:-https://api.neverbounce.com/v4}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_API_BASE_URL: ${LINKEDIN_API_BASE_URL:-https://api.linkedin.com/rest}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202601}
      TENCHAT_ACCESS_TOKEN: ${TENCHAT_ACCESS_TOKEN:-}
      TENCHAT_API_BASE_URL: ${TENCHAT_API_BASE_URL:-https://api.tenchat.ru/v1}
      TENCHAT_ACCOUNT_TIER: ${TENCHAT_ACCOUNT_TIER:-free}
      INTEGRATION_MAX_RETRIES: ${INTEGRATION_MAX_RETRIES:-3}
      INTEGRATION_CIRCUIT_FAILURE_THRESHOLD: ${INTEGRATION_CIRCUIT_FAILURE_THRESHOLD:-5}
      INTEGRATION_CIRCUIT_RECOVERY_SECONDS: ${INTEGRATION_CIRCUIT_RECOVERY_SECONDS:-60}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-notifications@localhost}
      WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:admin@localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEBHOOK_ALLOW_PRIVATE_URLS: ${WEBHOOK_ALLOW_PRIVATE_URLS:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TINKOFF_TERMINAL_KEY: ${TINKOFF_TERMINAL_KEY:-}
      TINKOFF_PASSWORD: ${TINKOFF_PASSWORD:-}
      DEFAULT_SENDER_DOMAIN: ${DEFAULT_SENDER_DOMAIN:-localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "emails,tracking,enrichment,bitrix,analytics,notifications,webhooks,billing,dead_letter", "--loglevel=INFO", "--concurrency=8"]
  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: *app-env
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    depends_on:
      api: {condition: service_started}
    ports: ["8080:80"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
