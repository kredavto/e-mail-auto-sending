name: premium-b2b-mailer

x-app-env: &app-env
  APP_ENV: production
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@mailer-postgres:5432/mailer
  DATABASE_NULL_POOL: ${DATABASE_NULL_POOL:-false}
  REDIS_URL: redis://mailer-redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-["https://premium-b2b-mailer.vercel.app"]}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  S3_ENDPOINT_URL: http://mailer-minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_BUCKET: ${S3_BUCKET:-mailer}
  S3_REGION: ${S3_REGION:-us-east-1}
  SMTP_HOST: ${SMTP_HOST:-mailer-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  DEFAULT_SENDER_DOMAIN: ${DEFAULT_SENDER_DOMAIN:-localhost}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://5.129.234.72/mailer}
  AWS_REGION: ${AWS_REGION:-eu-central-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
  SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN:-}
  BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
  HUNTER_API_KEY: ${HUNTER_API_KEY:-}
  NEVERBOUNCE_API_KEY: ${NEVERBOUNCE_API_KEY:-}
  NEVERBOUNCE_API_URL: ${NEVERBOUNCE_API_URL:-https://api.neverbounce.com/v4}
  LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
  LINKEDIN_API_BASE_URL: ${LINKEDIN_API_BASE_URL:-https://api.linkedin.com/rest}
  LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202601}
  TENCHAT_ACCESS_TOKEN: ${TENCHAT_ACCESS_TOKEN:-}
  TENCHAT_API_BASE_URL: ${TENCHAT_API_BASE_URL:-https://api.tenchat.ru/v1}
  TENCHAT_ACCOUNT_TIER: ${TENCHAT_ACCOUNT_TIER:-free}
  INTEGRATION_MAX_RETRIES: ${INTEGRATION_MAX_RETRIES:-3}
  INTEGRATION_CIRCUIT_FAILURE_THRESHOLD: ${INTEGRATION_CIRCUIT_FAILURE_THRESHOLD:-5}
  INTEGRATION_CIRCUIT_RECOVERY_SECONDS: ${INTEGRATION_CIRCUIT_RECOVERY_SECONDS:-60}
  NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-notifications@localhost}
  WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
  WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
  WEBPUSH_VAPID_SUBJECT: ${WEBPUSH_VAPID_SUBJECT:-mailto:admin@localhost}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  WEBHOOK_ALLOW_PRIVATE_URLS: ${WEBHOOK_ALLOW_PRIVATE_URLS:-false}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
  TINKOFF_TERMINAL_KEY: ${TINKOFF_TERMINAL_KEY:-}
  TINKOFF_PASSWORD: ${TINKOFF_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailer
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/010-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal:
        aliases: [mailer-postgres]
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal:
        aliases: [mailer-redis]
    deploy:
      resources:
        limits:
          memory: 96M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal:
        aliases: [mailer-minio]
    deploy:
      resources:
        limits:
          memory: 384M

  minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-mailer}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - mc alias set local http://mailer-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"
    networks:
      internal:
        aliases: [mailer-mailpit]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 96M

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: "no"
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@mailer-postgres:5432/mailer
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}:${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}@mailer-postgres:5432/mailer
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: premium-b2b-mailer-api
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_NULL_POOL: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "emails,tracking,enrichment,bitrix,analytics,notifications,webhooks,billing,dead_letter", "--loglevel=INFO", "--concurrency=2"]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 384M

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_NULL_POOL: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  internal:
    internal: true
  edge:
    external: true
    name: ${MAILER_EDGE_NETWORK:-tiktokbot_default}

volumes:
  postgres_data:
  redis_data:
  minio_data:
